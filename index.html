<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شروع طراحی هوشمند</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      font-family: Tahoma, Arial, sans-serif;

      background:
        radial-gradient(
          circle at top right,
          #fff3dc 0,
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #f8f7f4,
          #ebe7df
        );

      color: #292929;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .container {
      width: 100%;
      max-width: 520px;
    }


    .card {

      background: rgba(255,255,255,0.97);

      border-radius: 28px;

      padding: 32px 28px;

      box-shadow:
        0 20px 55px rgba(0,0,0,0.11);

      border: 1px solid rgba(0,0,0,0.05);

    }


    .header {
      text-align: center;
      margin-bottom: 30px;
    }


    .logo {

      width: 68px;
      height: 68px;

      margin: 0 auto 17px;

      border-radius: 21px;

      background:
        linear-gradient(
          135deg,
          #202020,
          #555
        );

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;

      box-shadow:
        0 12px 28px rgba(0,0,0,0.18);

    }


    h1 {

      margin: 0;

      font-size: 27px;

      font-weight: 900;

      line-height: 1.5;

    }


    .subtitle {

      margin: 12px 0 0;

      color: #777;

      font-size: 14px;

      line-height: 2;

    }


    .benefits {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;

      margin: 24px 0;

    }


    .benefit {

      background: #f7f5f1;

      border-radius: 14px;

      padding: 12px 5px;

      text-align: center;

      font-size: 11px;

      color: #555;

      line-height: 1.7;

    }


    .benefit-icon {

      display: block;

      font-size: 20px;

      margin-bottom: 4px;

    }


    label {

      display: block;

      margin-top: 17px;

      margin-bottom: 7px;

      font-size: 13px;

      font-weight: bold;

      color: #444;

    }


    input {

      width: 100%;

      padding: 15px;

      border-radius: 14px;

      border: 1px solid #ddd8cf;

      background: #fcfbf9;

      font-size: 16px;

      font-family: inherit;

      outline: none;

      transition: 0.2s;

    }


    input:focus {

      background: white;

      border-color: #777;

      box-shadow:
        0 0 0 3px
        rgba(0,0,0,0.04);

    }


    input::placeholder {

      color: #aaa;

    }


    .main-button {

      width: 100%;

      margin-top: 25px;

      padding: 16px;

      border: none;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #202020,
          #444
        );

      color: white;

      font-family: inherit;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 11px 27px
        rgba(0,0,0,0.18);

      transition: 0.2s;

    }


    .main-button:hover {

      transform:
        translateY(-1px);

      box-shadow:
        0 14px 30px
        rgba(0,0,0,0.22);

    }


    .main-button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

      transform: none;

    }


    .hint {

      text-align: center;

      margin-top: 14px;

      color: #999;

      font-size: 11px;

      line-height: 1.8;

    }


    #result {

      text-align: center;

      margin-top: 17px;

      font-size: 13px;

      line-height: 1.8;

    }


    .error {

      color: #c0392b;

    }


    .success {

      color: #16834b;

    }


    .loading {

      display: none;

      text-align: center;

      margin-top: 18px;

      color: #777;

      font-size: 12px;

    }


    .spinner {

      width: 25px;

      height: 25px;

      margin:
        0 auto 8px;

      border:
        3px solid #ddd;

      border-top-color:
        #333;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    @media (max-width: 520px) {

      body {

        padding: 10px;

      }


      .card {

        padding: 25px 20px;

        border-radius: 23px;

      }


      h1 {

        font-size: 23px;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <div class="card">


    <div class="header">

      <div class="logo">
        ✦
      </div>


      <h1>
        طراحی رویایی‌تان را شروع کنید
      </h1>


      <p class="subtitle">

        با کمک هوش مصنوعی،
        فضای موردنظرتان را طراحی کنید
        و یک برآورد اولیه از هزینه دریافت کنید.

      </p>

    </div>


    <div class="benefits">

      <div class="benefit">

        <span class="benefit-icon">
          ✨
        </span>

        طراحی هوشمند

      </div>


      <div class="benefit">

        <span class="benefit-icon">
          💰
        </span>

        برآورد اولیه

      </div>


      <div class="benefit">

        <span class="benefit-icon">
          ⚡
        </span>

        سریع و رایگان

      </div>

    </div>


    <form id="leadForm">


      <label for="name">
        نام و نام خانوادگی
      </label>

      <input
        type="text"
        id="name"
        placeholder="نام و نام خانوادگی"
        autocomplete="name"
        required
      >


      <label for="phone">
        شماره موبایل
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="09xxxxxxxxx"
        inputmode="numeric"
        autocomplete="tel"
        required
      >


      <button
        type="submit"
        id="submitBtn"
        class="main-button"
      >

        ✨ شروع طراحی رایگان

      </button>


    </form>

    <form id="otpForm" style="display:none;">

  <label for="otpCode">
    کد تایید ارسال‌شده را وارد کنید
  </label>

  <input
    type="text"
    id="otpCode"
    placeholder="کد ۶ رقمی"
    inputmode="numeric"
    autocomplete="one-time-code"
    maxlength="6"
    required
  >

  <button
    type="submit"
    id="otpSubmitBtn"
    class="main-button"
  >
    ✅ تایید کد
  </button>

</form>

    <div
      id="loading"
      class="loading"
    >

      <div class="spinner"></div>

      در حال آماده‌سازی...

    </div>


    <div
      id="result"
    ></div>


    <div class="hint">

      اطلاعات شما فقط برای ایجاد حساب و
      ادامه فرآیند طراحی استفاده می‌شود.

    </div>


  </div>


</div>


<script>

const LOGIN_URL =
  "https://app-n8n-mpce5.apps.de1.abrhapaas.com/webhook/customer-login";

const OTP_VERIFY_URL =
  "https://app-n8n-mpce5.apps.de1.abrhapaas.com/webhook/customer-otp-request";

let currentPhone = "";

const leadForm = document.getElementById("leadForm");
const otpForm = document.getElementById("otpForm");
const result = document.getElementById("result");
const loading = document.getElementById("loading");

/* مرحله ۱ — ارسال نام و شماره، دریافت OTP */

leadForm.addEventListener("submit", async function (e) {

  e.preventDefault();

  const button = document.getElementById("submitBtn");
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();

  result.textContent = "";
  result.className = "";

  if (!name || !phone) {
    result.textContent = "لطفاً نام و شماره موبایل را وارد کنید.";
    result.className = "error";
    return;
  }

  currentPhone = phone;

  button.disabled = true;
  loading.style.display = "block";
  button.innerText = "در حال ارسال کد...";

  try {

    const response = await fetch(LOGIN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, phone: phone })
    });

    if (!response.ok) {
      throw new Error("ارسال ناموفق بود");
    }

    const responseData = await response.json();
    console.log("LOGIN RESPONSE:", responseData);

    /* نمایش فرم OTP و مخفی کردن فرم اول */
    leadForm.style.display = "none";
    otpForm.style.display = "block";

    result.textContent = "کد تایید ارسال شد. لطفاً وارد کنید.";
    result.className = "success";

  } catch (error) {

    console.error(error);
    result.textContent = "خطا در ارسال درخواست. لطفاً دوباره تلاش کنید.";
    result.className = "error";

  } finally {

    loading.style.display = "none";
    button.disabled = false;
    button.innerText = "✨ شروع طراحی رایگان";

  }

});

/* مرحله ۲ — تایید OTP و دریافت customer_id واقعی */

otpForm.addEventListener("submit", async function (e) {

  e.preventDefault();

  const otpButton = document.getElementById("otpSubmitBtn");
  const code = document.getElementById("otpCode").value.trim();

  result.textContent = "";
  result.className = "";

  if (!code) {
    result.textContent = "لطفاً کد تایید را وارد کنید.";
    result.className = "error";
    return;
  }

  otpButton.disabled = true;
  loading.style.display = "block";
  otpButton.innerText = "در حال بررسی...";

  try {

    const response = await fetch(OTP_VERIFY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: currentPhone, code: code })
    });

    if (!response.ok) {
      throw new Error("تایید ناموفق بود");
    }

    const responseData = await response.json();
    console.log("OTP VERIFY RESPONSE:", responseData);

    if (!responseData.success || !responseData.customer_id) {
      throw new Error(responseData.message || "کد OTP نامعتبر است");
    }

    /* انتقال به صفحه طراحی با customer_id واقعی */
    window.location.href =
      "design.html?customer_id=" +
      encodeURIComponent(responseData.customer_id);

  } catch (error) {

    console.error(error);
    result.textContent = error.message || "کد وارد‌شده نامعتبر است.";
    result.className = "error";
    otpButton.disabled = false;
    otpButton.innerText = "✅ تایید کد";
    loading.style.display = "none";

  }

});

</script>


</body>

</html>
