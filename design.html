<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>طراحی هوشمند آشپزخانه</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
    }

    p {
      line-height: 1.8;
    }

    input,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      background: #222;
      color: white;
      cursor: pointer;
      border: none;
    }

    button:hover {
      opacity: 0.9;
    }

    #message {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>طراحی هوشمند آشپزخانه</h1>

    <p>
      عکس آشپزخانه خود را ارسال کنید تا طراحی پیشنهادی برای شما آماده شود.
    </p>

    <input
      type="file"
      id="image"
      name="image"
      accept="image/*"
    >

    <textarea
      id="description"
      placeholder="توضیحات دلخواه خود را بنویسید؛ مثلاً رنگ، سبک یا مدل موردنظر..."
    ></textarea>
<input
  type="number"
  id="wall_length"
  step="0.1"
  min="0"
  placeholder="طول دیوار کابینت (متر) - مثال: 4.2"
>

<input
  type="number"
  id="kitchen_width"
  step="0.1"
  min="0"
  placeholder="عرض آشپزخانه (متر) - مثال: 3.1"
>

<input
  type="number"
  id="ceiling_height"
  step="0.1"
  min="0"
  placeholder="ارتفاع سقف (متر) - مثال: 2.8"
>

<label style="display:block; margin-top:12px;">
  <input
    type="checkbox"
    id="dimensions_approximate"
    style="width:auto; margin-left:8px;"
  >
  اندازه‌ها تقریبی هستند
</label>
    

    <button id="send">
      ارسال درخواست طراحی
    </button>

    <p id="message"></p>

  </div>

  <script>

    document.getElementById("send").addEventListener("click", async () => {

      const file = document.getElementById("image").files[0];

      const description =
        document.getElementById("description").value;

      const message =
        document.getElementById("message");

      const wallLength =
  document.getElementById("wall_length").value;

const kitchenWidth =
  document.getElementById("kitchen_width").value;

const ceilingHeight =
  document.getElementById("ceiling_height").value;

const dimensionsApproximate =
  document.getElementById("dimensions_approximate").checked;

      if (!file) {
        message.textContent = "لطفاً عکس آشپزخانه را انتخاب کنید.";
        return;
      }

      // دریافت customer_id از آدرس صفحه
      let customerId =
        new URLSearchParams(window.location.search).get("customer_id");

      // تمیز کردن customer_id
      if (customerId) {
        customerId = customerId
          .trim()
          .replace(/^=/, "");
      }

      console.log("CUSTOMER ID:", customerId);

      // اگر customer_id وجود نداشت، ارسال را متوقف کن
      if (!customerId) {
        message.textContent =
          "شناسه مشتری پیدا نشد. لطفاً از صفحه اصلی وارد شوید.";
        return;
      }

      const formData = new FormData();

      formData.append("image", file);
      formData.append("description", description);
      formData.append("customer_id", customerId);
      formData.append("wall_length", wallLength);
formData.append("kitchen_width", kitchenWidth);
formData.append("ceiling_height", ceilingHeight);
formData.append("dimensions_approximate", dimensionsApproximate);

      try {

        const response = await fetch(
          "https://app-n8n-mpce5.apps.de1.abrhapaas.com/webhook/design-request",
          {
            method: "POST",
            body: formData
          }
        );

        if (response.ok) {

          message.textContent =
            "درخواست شما با موفقیت ارسال شد.";

        } else {

          message.textContent =
            "خطا در ارسال درخواست.";

        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "خطا در اتصال به سرور.";

      }

    });

  </script>

</body>
</html>
